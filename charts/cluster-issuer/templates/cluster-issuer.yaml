apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.name }}
spec:
  acme:
    server: {{ .Values.server }}
    {{- with .Values.email }}
    email: {{ . }}
    {{- end }}
    privateKeySecretRef:
      name: {{ .Values.name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingressClassName }}
