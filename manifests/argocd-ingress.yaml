apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # F5 NGINX rejects a second Ingress for the same host, so cert-manager
    # adds the ACME challenge path to this Ingress instead of creating its own
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - argocd.thankgodntemcloud.online
      secretName: argocd-server-tls
  rules:
    - host: argocd.thankgodntemcloud.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
